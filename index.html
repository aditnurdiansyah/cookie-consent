<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cookie Consent</title>

    <link rel="stylesheet" href="css/style.css">
    <!-- SEO (Search Engine Optimization) -->
    <meta name="description" content="Personal portfolio of Adit Nurdiansyah, a Full Stack Developer.">
    <meta name="keywords" content="Web Development, Full Stack Developer, HTML, CSS, Personal Portfolio">
    <meta name="author" content="Adit Nurdiansyah">

    <!-- Favicon -->
    <link rel="icon" href="/assets/favicon/favicon.ico" type="image/x-icon">

    <!-- OG (Open Graph) -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://aditnurdiansyah.my.id">
    <meta property="og:title" content="Adit Nurdiansyah - Full Stack Developer">
    <meta property="og:description" content="Single Page CV of Adit Nurdiansyah, a Full Stack Developer.">
    <meta property="og:image" content="https://aditnurdiansyah.my.id/assets/open-graph/aditnurdiansyah-full-stack-developer-og.jpg">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rosarivo:ital@0;1&display=swap" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">

    <!-- JS -->
    <script src="js/script.js" defer></script>
  </head>
  <body>
    <div class="cookie-popup" id="cookiePopup">
      <!-- Close Button -->
      <button class="close-btn" id="closeBtn" aria-label="Close cookie popup">
        <img src="assets/icons/cross.png" alt="Close">
      </button>

      <!-- Cookie Icon -->
      <img class="cookie-icon" src="assets/icons/cookie.png" alt="Cookie">

      <!-- Content -->
      <div class="cookie-content">
        <p>We use cookies to improve your experience.</p>
      </div>

      <!-- Accept Button -->
      <button class="accept-btn" id="acceptBtn">Accept Cookies</button>
    </div>
  </body>
</html>
